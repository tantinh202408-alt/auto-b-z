services:
  - type: web
    name: sangdev-zalo-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: BOT_PREFIX
        value: "'"
      - key: OWNER_ID
        sync: false
      - key: ZALO_COOKIE
        sync: false
      - key: ZALO_IMEI
        sync: false
      - key: ZALO_USER_AGENT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
